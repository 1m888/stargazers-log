<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { font-family: -apple-system, sans-serif; background: #f5f5f7; text-align: center; padding: 60px 20px; margin: 0; }
  h1 { font-size: 36px; letter-spacing: -1px; color: #1d1d1f; }
  p { color: #86868b; font-size: 18px; margin-bottom: 40px; }
  .btn { background: #0071e3; color: #fff; border: none; padding: 16px 32px; border-radius: 99px; font-size: 18px; font-weight: 600; cursor: pointer; }
  
  /* 支付弹窗 */
  .modal { position: fixed; bottom: -100%; left: 0; width: 100%; background: #fff; border-radius: 24px 24px 0 0; padding: 30px 20px; box-sizing: border-box; transition: bottom 0.3s ease; box-shadow: 0 -10px 40px rgba(0,0,0,0.1); text-align: left; }
  .modal.show { bottom: 0; }
  .modal h3 { margin-top: 0; font-size: 20px; text-align: center; }
  .pay-card { background: #f5f5f7; padding: 20px; border-radius: 16px; display: flex; justify-content: space-between; font-size: 20px; font-weight: 600; margin: 20px 0; }
  .btn-confirm { background: #1d1d1f; color: #fff; border: none; padding: 18px; border-radius: 16px; font-size: 18px; font-weight: 600; width: 100%; cursor: pointer; }
  .mask { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: none; }
  .mask.show { display: block; }
</style>
</head>
<body>

<h1>全新登场。</h1>
<p>点击下方按钮体验假付款功能</p>
<button class="btn" onclick="openPay()">立即购买</button>

<div class="mask" id="mask" onclick="closePay()"></div>

<div class="modal" id="modal">
  <h3>确认订单</h3>
  <div class="pay-card">
    <span>Apple Pay</span>
    <span>¥ 1,899</span>
  </div>
  <button class="btn-confirm" id="payBtn" onclick="doPay()">双击侧边按钮付款</button>
</div>

<script>
  function openPay() {
    document.getElementById('modal').classList.add('show');
    document.getElementById('mask').classList.add('show');
  }
  function closePay() {
    document.getElementById('modal').classList.remove('show');
    document.getElementById('mask').classList.remove('show');
    setTimeout(() => {
      const btn = document.getElementById('payBtn');
      btn.innerText = '双击侧边按钮付款';
      btn.style.background = '#1d1d1f';
      btn.disabled = false;
    }, 300);
  }
  function doPay() {
    const btn = document.getElementById('payBtn');
    btn.innerText = '处理中...';
    btn.disabled = true;
    setTimeout(() => {
      btn.innerText = '✓ 支付成功';
      btn.style.background = '#34c759';
      setTimeout(closePay, 1500);
    }, 1200);
  }
</script>
</body>
</html>
