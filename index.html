<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人主页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;}
body{background:#0f172a;color:#e5e7eb;min-height:100vh;line-height:1.7;}
.hero{padding:60px 20px;text-align:center;}
.avatar{width:110px;height:110px;border-radius:50%;background:#3b82f6;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff;}
h1{font-size:28px;margin-bottom:10px;}
.subtitle{color:#94a3b8;font-size:16px;}
.container{max-width:680px;margin:0 auto;padding:0 20px 60px;}
.card{background:#1e293b;border-radius:16px;padding:24px;margin-bottom:18px;}
.card h2{font-size:20px;margin-bottom:12px;color:#60a5fa;}
.card p{font-size:15px;color:#cbd5e1;}
.tag{display:inline-block;background:#334155;color:#93c5fd;padding:5px 11px;border-radius:20px;margin:4px;font-size:14px;}
.footer{text-align:center;padding:24px;color:#64748b;font-size:14px;}
</style>
</head>
<body>
<section class="hero">
<div class="avatar">我</div>
<h1>你好，欢迎来到我的主页</h1>
<p class="subtitle">个人介绍 · 学习与记录</p>
</section>
<div class="container">
<div class="card">
<h2>关于我</h2>
<p>这里是我的个人主页，记录个人简介、兴趣爱好、学习经历与日常分享，持续更新。</p>
</div>
<div class="card">
<h2>兴趣爱好</h2>
<span class="tag">学习</span>
<span class="tag">数码</span>
<span class="tag">阅读</span>
<span class="tag">探索新技术</span>
</div>
<div class="card">
<h2>联系方式</h2>
<p>欢迎交流，可在此处后续自行修改添加邮箱、社交账号。</p>
</div>
</div>
<div class="footer">© 个人主页 · Powered by GitHub Pages</div>
</body>
</html>
