<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Style Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            background: #ffffff;
            color: #1d1d1f;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        
        /* 苹果风毛玻璃导航 */
        .nav {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 100;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }
        .nav-inner {
            max-width: 1024px; margin: 0 auto; height: 48px; padding: 0 20px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .logo { font-size: 17px; font-weight: 600; color: #1d1d1f; text-decoration: none; letter-spacing: -0.02em;}
        .nav-links { display: flex; gap: 24px; font-size: 13px; }
        .nav-links a { color: #424245; text-decoration: none; transition: color 0.2s; }
        .nav-links a:hover { color: #000; }
        .bag-btn { background: none; border: none; cursor: pointer; font-size: 16px; color: #1d1d1f; position: relative; }
        .bag-count {
            position: absolute; top: -4px; right: -10px; background: #0071e3; color: #fff;
            font-size: 10px; line-height: 16px; min-width: 16px; height: 16px; border-radius: 8px; text-align: center;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 首屏 */
        .hero { max-width: 1024px; margin: 0 auto; padding: 120px 20px 60px; text-align: center; }
        .hero h1 { font-size: 56px; font-weight: 600; letter-spacing: -0.04em; line-height: 1.05; animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) both; }
        .hero p { margin-top: 16px; font-size: 21px; color: #86868b; animation: fadeUp 0.8s 0.1s cubic-bezier(0.22, 1, 0.36, 1) both; }

        /* 商品列表 */
        .products { max-width: 1024px; margin: 0 auto; padding: 40px 20px 100px; }
        .products h2 { font-size: 32px; font-weight: 600; margin-bottom: 24px; letter-spacing: -0.02em; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .card {
            background: #f5f5f7; border-radius: 20px; padding: 20px; text-align: center;
            transition: transform 0.3s ease; animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
            display: flex; flex-direction: column; align-items: center;
        }
        .card:hover { transform: scale(1.02); }
        
        /* 内嵌的矢量产品图样式 */
        .card svg {
            width: 100%; height: 200px; background: #ffffff; border-radius: 12px; 
            margin-bottom: 20px; padding: 20px; transition: transform 0.3s ease;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.02);
        }
        .card:hover svg { transform: scale(1.05); }
        
        .card h3 { font-size: 17px; font-weight: 600; }
        .card .price { margin-top: 8px; color: #86868b; font-size: 14px; }
        .btn-add {
            margin-top: 16px; background: #0071e3; color: #fff; border: none; padding: 8px 20px;
            border-radius: 99px; font-size: 13px; cursor: pointer; transition: background 0.2s;
        }
        .btn-add:hover { background: #0077ed; }

        /* 购物袋面板 */
        .bag-panel {
            position: fixed; top: 0; right: 0; width: 320px; height: 100%; background: #fff;
            z-index: 200; transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: -10px 0 30px rgba(0,0,0,0.1); display: flex; flex-direction: column;
        }
        .bag-panel.open { transform: translateX(0); }
        .bag-header { padding: 24px; border-bottom: 1px solid #d2d2d7; display: flex; justify-content: space-between; align-items: center; }
        .bag-header h3 { font-size: 20px; }
        .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #86868b; }
        .bag-items { flex: 1; overflow-y: auto; padding: 20px 24px; }
        .bag-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f5f5f7; font-size: 14px; }
        .bag-footer { padding: 20px 24px; border-top: 1px solid #d2d2d7; display: flex; flex-direction: column; gap: 15px; }
        .bag-total-row { display: flex; justify-content: space-between; font-weight: 600; font-size: 16px; }
        
        /* 模拟支付按钮 */
        .btn-checkout {
            background: #0071e3; color: #fff; border: none; padding: 14px; border-radius: 12px;
            font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s;
        }
        .btn-checkout:hover { background: #0077ed; }

        /* 遮罩层 */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3);
            z-index: 150; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .overlay.show { opacity: 1; pointer-events: auto; }

        /* 支付成功弹窗 */
        .success-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 40px 30px; border-radius: 24px; z-index: 300; text-align: center;
            opacity: 0; pointer-events: none; transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.15); width: 280px;
        }
        .success-modal.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
        .check-icon {
            width: 60px; height: 60px; background: #34c759; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;
            color: #fff; font-size: 30px;
        }
        .success-modal h3 { font-size: 22px; margin-bottom: 8px; letter-spacing: -0.01em; }
        .success-modal p { color: #86868b; font-size: 14px; }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .hero h1 { font-size: 40px; }
            .hero p { font-size: 17px; }
            .grid { grid-template-columns: 1fr 1fr; gap: 12px; }
            .card svg { height: 140px; padding: 10px; }
        }
    </style>
</head>
<body>

    <header class="nav">
        <div class="nav-inner">
            <a href="#" class="logo">Store</a>
            <nav class="nav-links">
                <a href="#">首页</a>
                <a href="#products">全部产品</a>
            </nav>
            <button class="bag-btn" id="openBag">🛍 <span class="bag-count" id="bagCount">0</span></button>
        </div>
    </header>

    <main>
        <section class="hero">
            <h1>全新登场。</h1>
            <p>轻盈、强大、恰到好处。</p>
        </section>

        <section class="products" id="products">
            <h2>全部产品</h2>
            <div class="grid" id="productGrid"></div>
        </section>
    </main>

    <div class="overlay" id="overlay"></div>

    <!-- 购物袋面板 -->
    <aside class="bag-panel" id="bagPanel">
        <div class="bag-header">
            <h3>购物袋</h3>
            <button class="close-btn" id="closeBag">×</button>
        </div>
        <div class="bag-items" id="bagItems"></div>
        <div class="bag-footer">
            <div class="bag-total-row">
                <span>合计</span>
                <span id="bagTotal">¥0</span>
            </div>
            <button class="btn-checkout" id="checkoutBtn" onclick="simulatePayment()">立即支付</button>
        </div>
    </aside>

    <!-- 支付成功弹窗 -->
    <div class="success-modal" id="successModal">
        <div class="check-icon">✓</div>
        <h3>支付成功</h3>
        <p>感谢您的购买，即将为您发货</p>
    </div>

    <script>
        // 这里存放的是我自己手绘的极简矢量图（SVG），没有任何外部链接，绝对不失效
        const svgAirpods = `<svg viewBox="0 0 100 100" fill="none" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M35 40 C35 30 45 25 50 25 C55 25 65 30 65 40 V75 A5 5 0 0 1 60 80 H40 A5 5 0 0 1 35 75 V40 Z"/><circle cx="50" cy="45" r="8"/><path d="M20 50 C20 40 30 35 35 35 V75 A5 5 0 0 1 30 80 H25 A5 5 0 0 1 20 75 V50 Z"/><path d="M80 50 C80 40 70 35 65 35 V75 A5 5 0 0 0 70 80 H75 A5 5 0 0 0 80 75 V50 Z"/></svg>`;
        
        const svgWatch = `<svg viewBox="0 0 100 100" fill="none" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="30" y="25" width="40" height="50" rx="10"/><path d="M40 25 V15 H60 V25"/><path d="M40 75 V85 H60 V75"/><rect x="35" y="30" width="30" height="40" rx="5" fill="#f5f5f7"/><circle cx="50" cy="50" r="12" stroke-dasharray="2 4"/><path d="M50 44 V50 L54 52"/></svg>`;
        
        const svgHomepod = `<svg viewBox="0 0 100 100" fill="none" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="30" y="30" width="40" height="45" rx="10"/><path d="M35 30 C35 20 65 20 65 30"/><circle cx="50" cy="35" r="8" fill="#1d1d1f"/><path d="M40 60 H60 M40 65 H60"/></svg>`;
        
        const svgMac = `<svg viewBox="0 0 100 100" fill="none" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="20" y="25" width="60" height="40" rx="4"/><rect x="25" y="30" width="50" height="30" fill="#f5f5f7"/><path d="M10 70 H90 L85 75 H15 L10 70 Z"/><path d="M45 70 H55"/></svg>`;

        const products = [
            { id: 1, name: "AirPods Pro", price: 1899, svg: svgAirpods },
            { id: 2, name: "Apple Watch", price: 2999, svg: svgWatch },
            { id: 3, name: "HomePod mini", price: 749, svg: svgHomepod },
            { id: 4, name: "MacBook Pro", price: 12999, svg: svgMac }
        ];

        const grid = document.getElementById('productGrid');
        const bagPanel = document.getElementById('bagPanel');
        const overlay = document.getElementById('overlay');
        const bagItems = document.getElementById('bagItems');
        const bagTotal = document.getElementById('bagTotal');
        const bagCount = document.getElementById('bagCount');
        const successModal = document.getElementById('successModal');
        let cart = [];

        // 渲染商品列表，直接插入 svg 代码
        products.forEach((p, index) => {
            const delay = index * 0.1;
            grid.innerHTML += `
                <div class="card" style="animation-delay: ${delay}s">
                    ${p.svg}
                    <h3>${p.name}</h3>
                    <div class="price">¥${p.price}</div>
                    <button class="btn-add" onclick="addToCart(${p.id})">加入购物袋</button>
                </div>
            `;
        });

        function addToCart(id) {
            cart.push(products.find(p => p.id === id));
            updateCart();
            openBag();
        }

        function updateCart() {
            bagCount.innerText = cart.length;
            if (cart.length === 0) {
                bagItems.innerHTML = '<p style="color:#86868b; margin-top:20px; text-align:center;">购物袋是空的。</p>';
                document.getElementById('checkoutBtn').style.display = 'none';
            } else {
                bagItems.innerHTML = cart.map((item, index) => `
                    <div class="bag-item">
                        <span>${item.name}</span>
                        <span>¥${item.price} <a href="javascript:void(0)" onclick="removeItem(${index})" style="color:#0071e3; margin-left:10px; font-size:12px; text-decoration:none;">移除</a></span>
                    </div>
                `).join('');
                document.getElementById('checkoutBtn').style.display = 'block';
            }
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            bagTotal.innerText = `¥${total}`;
        }

        function removeItem(index) {
            cart.splice(index, 1);
            updateCart();
        }

        function openBag() {
            bagPanel.classList.add('open');
            overlay.classList.add('show');
        }

        function closeBag() {
            bagPanel.classList.remove('open');
            overlay.classList.remove('show');
        }

        function simulatePayment() {
            closeBag();
            successModal.classList.add('show');
            overlay.classList.add('show');
            
            setTimeout(() => {
                successModal.classList.remove('show');
                overlay.classList.remove('show');
                cart = [];
                updateCart();
            }, 2000);
        }

        document.getElementById('openBag').addEventListener('click', openBag);
        document.getElementById('closeBag').addEventListener('click', closeBag);
        overlay.addEventListener('click', closeBag);

        updateCart();
    </script>
</body>
</html>
