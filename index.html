<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Style Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
            background: #ffffff;
            color: #1d1d1f;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        .nav {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 100;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }
        .nav-inner {
            height: 50px; padding: 0 20px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .logo { font-size: 18px; font-weight: 600; color: #1d1d1f; text-decoration: none; }
        .nav-links { display: flex; gap: 15px; font-size: 13px; }
        .nav-links a { color: #424245; text-decoration: none; }
        .bag-btn {
            background: none; border: none; font-size: 18px; color: #1d1d1f; position: relative;
        }
        .bag-count {
            position: absolute; top: -5px; right: -8px; background: #0071e3; color: #fff;
            font-size: 10px; width: 16px; height: 16px; border-radius: 50%; text-align: center; line-height: 16px;
        }
        .hero { padding: 120px 20px 60px; text-align: center; }
        .hero h1 { font-size: 44px; font-weight: 600; letter-spacing: -0.03em; margin-bottom: 10px; }
        .hero p { font-size: 18px; color: #86868b; }
        .products { padding: 40px 20px 100px; }
        .products h2 { font-size: 26px; font-weight: 600; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card {
            background: #f5f5f7; border-radius: 18px; padding: 20px; text-align: center;
            cursor: pointer;
        }
        .img-box { width: 100%; height: 120px; background: #fff; border-radius: 12px; margin-bottom: 15px; }
        .card h3 { font-size: 15px; font-weight: 600; margin-bottom: 5px; }
        .card .price { color: #86868b; font-size: 13px; margin-bottom: 12px; }
        .btn-add {
            background: #0071e3; color: #fff; border: none; padding: 8px 16px;
            border-radius: 20px; font-size: 12px; cursor: pointer;
        }
        .bag-panel {
            position: fixed; top: 0; right: 0; width: 80%; height: 100%; background: #fff;
            z-index: 200; transform: translateX(100%); transition: transform 0.3s ease;
            box-shadow: -5px 0 20px rgba(0,0,0,0.1); display: flex; flex-direction: column;
        }
        .bag-panel.open { transform: translateX(0); }
        .bag-header { padding: 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        .bag-header h3 { font-size: 20px; }
        .close-btn { background: none; border: none; font-size: 24px; color: #86868b; }
        .bag-items { flex: 1; padding: 20px; overflow-y: auto; }
        .bag-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; font-size: 14px; }
        .bag-footer { padding: 20px; border-top: 1px solid #eee; display: flex; justify-content: space-between; font-weight: 600; }
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4);
            z-index: 150; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .overlay.show { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body>

    <header class="nav">
        <div class="nav-inner">
            <a href="#" class="logo">Store</a>
            <nav class="nav-links">
                <a href="#">首页</a>
                <a href="#">全部产品</a>
                <a href="#">音频</a>
                <a href="#">穿戴</a>
            </nav>
            <button class="bag-btn" id="openBag">🛍 <span class="bag-count" id="bagCount">0</span></button>
        </div>
    </header>

    <main>
        <section class="hero">
            <h1>全新登场。</h1>
            <p>轻盈、强大、恰到好处。</p>
        </section>

        <section class="products">
            <h2>全部产品</h2>
            <div class="grid" id="productGrid"></div>
        </section>
    </main>

    <div class="overlay" id="overlay"></div>
    <aside class="bag-panel" id="bagPanel">
        <div class="bag-header">
            <h3>购物袋</h3>
            <button class="close-btn" id="closeBag">×</button>
        </div>
        <div class="bag-items" id="bagItems"></div>
        <div class="bag-footer">
            <span>合计</span>
            <span id="bagTotal">¥0</span>
        </div>
    </aside>

    <script>
        const products = [
            { id: 1, name: "AirPods Pro", price: 1899 },
            { id: 2, name: "Apple Watch", price: 2999 },
            { id: 3, name: "HomePod mini", price: 749 },
            { id: 4, name: "MagSafe", price: 329 }
        ];
        const grid = document.getElementById('productGrid');
        const bagPanel = document.getElementById('bagPanel');
        const overlay = document.getElementById('overlay');
        const bagItems = document.getElementById('bagItems');
        const bagTotal = document.getElementById('bagTotal');
        const bagCount = document.getElementById('bagCount');
        let cart = [];

        products.forEach(p => {
            grid.innerHTML += `
                <div class="card">
                    <div class="img-box"></div>
                    <h3>${p.name}</h3>
                    <div class="price">¥${p.price}</div>
                    <button class="btn-add" onclick="addToCart(${p.id})">加入购物袋</button>
                </div>
            `;
        });

        function addToCart(id) {
            cart.push(products.find(p => p.id === id));
            updateCart();
            openBag();
        }

        function updateCart() {
            bagCount.innerText = cart.length;
            if (cart.length === 0) {
                bagItems.innerHTML = '<p style="color:#86868b;">购物袋是空的。</p>';
            } else {
                bagItems.innerHTML = cart.map((item, index) => `
                    <div class="bag-item">
                        <span>${item.name}</span>
                        <span>¥${item.price} <a href="javascript:void(0)" onclick="removeItem(${index})" style="color:#0071e3; margin-left:10px;">移除</a></span>
                    </div>
                `).join('');
            }
            bagTotal.innerText = `¥${cart.reduce((sum, item) => sum + item.price, 0)}`;
        }

        function removeItem(index) {
            cart.splice(index, 1);
            updateCart();
        }

        function openBag() {
            bagPanel.classList.add('open');
            overlay.classList.add('show');
        }

        function closeBag() {
            bagPanel.classList.remove('open');
            overlay.classList.remove('show');
        }

        document.getElementById('openBag').onclick = openBag;
        document.getElementById('closeBag').onclick = closeBag;
        overlay.onclick = closeBag;
        updateCart();
    </script>
</body>
</html>
