<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Store</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a href="#" class="logo">Store</a>
      <nav class="nav-links">
        <a href="#home" class="active">首页</a>
        <a href="#products">全部产品</a>
        <a href="#audio">音频</a>
        <a href="#wearable">穿戴</a>
      </nav>
      <div class="nav-actions">
        <button class="icon-btn" aria-label="搜索">⌕</button>
        <button class="icon-btn bag-btn" aria-label="购物袋">🛍<span class="bag-count">0</span></button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero" id="home">
      <h1 class="hero-title">全新登场。</h1>
      <p class="hero-sub">轻盈、强大、恰到好处。</p>
      <div class="hero-links">
        <a href="#products" class="link">选购产品 ›</a>
        <a href="#products" class="link">了解更多 ›</a>
      </div>
      <div class="hero-visual"></div>
    </section>

    <section class="products" id="products">
      <h2 class="section-title">全部产品</h2>
      <div class="product-grid" id="productGrid"></div>
    </section>
  </main>

  <aside class="bag-panel" id="bagPanel">
    <div class="bag-header">
      <h3>购物袋</h3>
      <button class="close-btn" id="closeBag">×</button>
    </div>
    <div class="bag-items" id="bagItems"></div>
    <div class="bag-footer">
      <span>合计</span>
      <strong id="bagTotal">¥0</strong>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>

  <script src="js/main.js"></script>
</body>
</html>
